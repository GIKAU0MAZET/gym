{% extends 'base.html' %}
{% block title %}Редактировать абонемент{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="POST">
    <div class="form-group"><label>Клиент *</label>
      <select name="client_id" required>
        {% for c in clients %}
        <option value="{{ c[0] }}" {% if abo[1]==c[0] %}selected{% endif %}>{{ c[1] }} {{ c[2] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Тип абонемента *</label>
      <select name="type_id" required>
        {% for t in types %}
        <option value="{{ t[0] }}" {% if abo[2]==t[0] %}selected{% endif %}>{{ t[1] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Дата начала</label>
        <input type="date" name="start_date" value="{{ abo[3].strftime('%Y-%m-%d') if abo[3] else '' }}">
      </div>
      <div class="form-group"><label>Дата окончания</label>
        <input type="date" name="end_date" value="{{ abo[4].strftime('%Y-%m-%d') if abo[4] else '' }}">
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="/abonements" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
