{% extends 'base.html' %}
{% block title %}{{ 'Редактировать тренировку' if training else 'Новая тренировка' }}{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="POST">
    <div class="form-group"><label>Название *</label>
      <input type="text" name="name" required value="{{ training[4] if training else '' }}">
    </div>
    <div class="form-group"><label>Тренер *</label>
      <select name="employee_id" required>
        <option value="">— выберите —</option>
        {% for e in trainers %}
        <option value="{{ e[0] }}" {% if training and training[1]==e[0] %}selected{% endif %}>
          {{ e[1] }} {{ e[2] }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Дата и время *</label>
        <input type="datetime-local" name="datetime_val" required
               value="{{ training[3].strftime('%Y-%m-%dT%H:%M') if training and training[3] else '' }}">
      </div>
      <div class="form-group"><label>Макс. участников *</label>
        <input type="number" name="max_participants" min="1" required value="{{ training[5] if training else 10 }}">
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="/trainings" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
