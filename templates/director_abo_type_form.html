{% extends 'base.html' %}
{% block title %}{{ 'Редактировать тип' if t else 'Новый тип абонемента' }}{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="POST">
    <div class="form-group">
      <label>Название *</label>
      <input type="text" name="name" required placeholder="Например: Стандарт"
             value="{{ t[1] if t else '' }}">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Стоимость (₽) *</label>
        <input type="number" name="cost" required min="0" placeholder="3000"
               value="{{ t[2] if t else '' }}">
      </div>
      <div class="form-group">
        <label>Срок (дней) *</label>
        <input type="number" name="days" required min="1" placeholder="30"
               value="{{ t[3] if t else '' }}">
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="/director/abo-types" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
