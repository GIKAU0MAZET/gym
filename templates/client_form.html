{% extends 'base.html' %}
{% block title %}{{ 'Редактировать клиента' if client else 'Новый клиент' }}{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="POST">
    <div class="grid-2">
      <div class="form-group"><label>Фамилия *</label>
        <input type="text" name="last_name" required value="{{ client[1] if client else '' }}">
      </div>
      <div class="form-group"><label>Имя *</label>
        <input type="text" name="first_name" required value="{{ client[2] if client else '' }}">
      </div>
    </div>
    <div class="form-group"><label>Отчество</label>
      <input type="text" name="middle_name" value="{{ client[3] if client else '' }}">
    </div>
    <div class="form-group"><label>Телефон</label>
      <input type="text" name="phone" value="{{ client[4] if client else '' }}">
    </div>
    <div class="form-group"><label>Email</label>
      <input type="email" name="email" value="{{ client[5] if client else '' }}">
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="/clients" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
